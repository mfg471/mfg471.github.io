<!doctype html><html><head>

	<meta charset="utf-8">

	<!-- 🚀 The path is completely correct now -->
	<base href="https://mfg471.github.io/games/poly-track/poly-track/">

	<script>
		(function() {
			const OriginalWorker = window.Worker;
			window.Worker = function(stringUrl, options) {
				const resolvedUrl = new URL(stringUrl, document.baseURI).href;
				if (resolvedUrl.indexOf(window.location.origin) !== 0) {
					const blobCode = "importScripts('" + resolvedUrl + "');";
					const blob = new Blob([blobCode], { type: 'application/javascript' });
					return new OriginalWorker(URL.createObjectURL(blob), options);
				}
				return new OriginalWorker(stringUrl, options);
			};
		})();
	</script>
