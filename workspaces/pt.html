<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- This is what shows on the browser tab if a teacher glances over -->
  <title>The CGI | Workspaces Sandbox</title>
  <style>
    /* Forces the game window to stretch perfectly to the edges of your iPad screen */
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- Securely streams the working game package natively inside an isolated frame -->
  <iframe src="../cgi-cdn/games/poly-track/assets/index.html" allowfullscreen></iframe>

</body>
</html>
