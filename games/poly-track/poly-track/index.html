<!doctype html><html><head>

	<meta name="robots" content="noindex,nofollow" />

	<meta charset="utf-8"><link rel="preload" href="forced_square.woff2" as="font" type="font/woff2" crossorigin="anonymous"/><link rel="preload" href="images/logo.svg" as="image" type="image/svg+xml"/><link rel="preload" href="images/discord.svg" as="image" type="image/svg+xml"/><link rel="manifest" href="manifest.json"/><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><script defer="defer" src="error_screen.bundle.js"></script><script defer="defer" src="main.bundle.js"></script></head><body><canvas id="screen"></canvas><div id="ui"></div><div id="transition-layer"></div>

<script>
// --- CGI CLOUD STORAGE CONFIG ---
	
const part1 = 'ghp_jwca79IMJztryp'; 
const part2 = 'X0f7M9icNclJx7oR2dxmDa';

const GITHUB_TOKEN = part1 + part2; 
const REPO_OWNER = 'mfg471'; 
const REPO_NAME = 'cgi-cloud-saves'; 
const FILE_PATH = 'saves/player_save.json';
	
// --- FEATURE 1: LOAD SAVES FROM REPOSITORY ON LAUNCH ---
async function loadSavesFromGitHub() {
    try {
        const response = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        
        if (response.ok) {
            const fileData = await response.json();
            // Decode the Base64 data from GitHub back into a string
            const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
            const saveData = JSON.parse(decodedContent);
            
            // Inject the data directly into your browser's local storage
            for (const key in saveData) {
                localStorage.setItem(key, saveData[key]);
            }
            console.log("CGI Cloud Data Successfully Injected into LocalStorage!");
        } else {
            console.log("No cloud save found. Starting fresh.");
        }
    } catch (error) {
        console.error("Cloud synchronization failed on launch:", error);
    }
}

// --- FEATURE 2: BACKUP SAVES TO REPOSITORY ---
async function backupSavesToGitHub() {
    if (localStorage.length === 0) return; // Nothing to save yet

    const saveData = {};
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        saveData[key] = localStorage.getItem(key);
    }
    
    const contentToBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(saveData, null, 2))));

    let sha = "";
    try {
        const res = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        if (res.ok) {
            const fileData = await res.json();
            sha = fileData.sha;
        }
    } catch (e) {}

    const response = await fetch(`https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        method: 'PUT',
        headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            message: 'CGI Engine Cloud Save Auto-Update',
            content: contentToBase64,
            sha: sha || undefined
        })
    });

    if (response.ok) console.log("Cloud backup completed successfully!");
}

// --- AUTOMATION TRIGGERS ---
// 1. Immediately look for and pull cloud data before the user plays
loadSavesFromGitHub();

// 2. Backup to the cloud every 60 seconds
setInterval(backupSavesToGitHub, 60000);

// 3. Backup to the cloud if the browser tab loses focus or minimizes
window.addEventListener('blur', backupSavesToGitHub);
</script>

</body></html>
